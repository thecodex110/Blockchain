# Render Blueprint: the web app as one free web service.
# The bridge is pure Python standard library, so there is nothing to install.
# Render routes traffic to the port in $PORT.
services:
  - type: web
    name: blockchain-light-wallet
    runtime: python
    plan: free
    autoDeploy: true
    buildCommand: python run_tests.py
    startCommand: python -m web.bridge --host 0.0.0.0 --port $PORT
    healthCheckPath: /api/state
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.9
      - key: PYTHONUNBUFFERED
        value: "1"
